<!DOCTYPE html><html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arjun Calc Pro</title><style>
* {
  box-sizing: border-box;
}

body {
  background: #101010;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #ff9500;
}

.calculator {
  max-width: 360px;
  margin: auto;
  background: #202020;
  padding: 20px;
  border-radius: 25px;
}

#display {
  width: 100%;
  height: 85px;
  background: #303030;
  color: white;
  border: 0;
  border-radius: 15px;
  text-align: right;
  font-size: 32px;
  padding: 15px;
  margin-bottom: 20px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

button {
  height: 60px;
  border: 0;
  border-radius: 14px;
  background: #383838;
  color: white;
  font-size: 22px;
  cursor: pointer;
}

button:active {
  opacity: 0.7;
}

.operator {
  background: #ff9500;
}

.equal {
  background: #00a86b;
}

.clear {
  background: #b83232;
}

.history {
  max-width: 360px;
  margin: 20px auto;
  background: #202020;
  padding: 15px;
  border-radius: 18px;
}

.history h2 {
  color: #ff9500;
}

.history-item {
  background: #303030;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  font-size: 17px;
  cursor: pointer;
}

#clearHistory {
  background: #b83232;
  padding: 10px 18px;
  height: auto;
  font-size: 15px;
}
</style></head><body><h1>ARJUN CALC PRO</h1><div class="calculator"><input id="display" readonly placeholder="0"><div class="buttons"><button class="clear" onclick="clearAll()">AC</button>
<button onclick="del()">⌫</button>
<button class="operator" onclick="add('%')">%</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="clearAll()">C</button>
<button class="equal" onclick="calculate()">=</button>

</div>
</div><div class="history"><h2>📜 Calculation History</h2><div id="historyList">No calculations yet</div><button id="clearHistory" onclick="clearHistory()">
Clear History
</button></div><script>

let display = document.getElementById("display");
let history = [];

try {
  history = JSON.parse(
    localStorage.getItem("arjunHistory")
  ) || [];
} catch (error) {
  history = [];
}

function saveHistory() {
  try {
    localStorage.setItem(
      "arjunHistory",
      JSON.stringify(history)
    );
  } catch (error) {
    console.log("History could not be saved.");
  }
}

function add(value) {
  if (display.value === "Error") {
    display.value = "";
  }

  display.value += value;
}

function clearAll() {
  display.value = "";
}

function del() {
  display.value = display.value.slice(0, -1);
}

function calculate() {
  let expression = display.value;

  try {
    if (!expression ||
        !/^[0-9+\-*/%.() ]+$/.test(expression)) {
      throw new Error("Invalid");
    }

    let result = Function(
      '"use strict"; return (' + expression + ')'
    )();

    if (!Number.isFinite(result)) {
      throw new Error("Invalid");
    }

    result = Number(result.toPrecision(12));

    history.unshift({
      question: expression,
      answer: result
    });

    saveHistory();
    showHistory();

    display.value = result;

  } catch (error) {
    display.value = "Error";
  }
}

function showHistory() {
  let list = document.getElementById("historyList");
  list.innerHTML = "";

  if (history.length === 0) {
    list.textContent = "No calculations yet";
    return;
  }

  history.forEach(function(item) {
    let row = document.createElement("div");

    row.className = "history-item";
    row.textContent = item.question + " = " + item.answer;

    row.onclick = function() {
      display.value = item.answer;
    };

    list.appendChild(row);
  });
}

function clearHistory() {
  history = [];

  try {
    localStorage.removeItem("arjunHistory");
  } catch (error) {}

  showHistory();
}

showHistory();

</script></body>
  </html>
